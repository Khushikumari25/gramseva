<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - GramSeva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{inter:['Inter','Noto Sans Devanagari','sans-serif'],poppins:['Poppins','Noto Sans Devanagari','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .sidebar-link.active { background: rgba(34,197,94,0.1); color: #15803d; border-right: 3px solid #15803d; }
    html[data-theme="dark"] .sidebar-link.active { background: rgba(74,222,128,0.1); color: #4ade80; border-color: #4ade80; }
    .sidebar-link { border: none; background: none; cursor: pointer; }
    .spinner{width:32px;height:32px;border:3px solid rgba(22,163,74,0.2);border-top-color:#16a34a;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  </style>
</head>
<body class="font-inter min-h-screen bg-gray-50 dark:bg-zinc-900 dark:text-gray-100 flex">
  <!-- Apply saved theme -->
  <script>
    (function(){
      const t = localStorage.getItem('gramseva_theme');
      if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('dark');}
    })();
  </script>
  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 min-h-screen bg-white dark:bg-zinc-800 border-r dark:border-zinc-700 flex flex-col fixed lg:relative z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="p-5 border-b dark:border-zinc-700">
      <a href="/" class="flex items-center gap-2">
        <img src="/assets/images/logo.png" alt="GramSeva" class="w-9 h-9 rounded-full object-contain">
        <span class="font-poppins font-bold text-green-800 dark:text-green-400">GramSeva</span>
      </a>
    </div>
    <nav class="flex-1 py-4 overflow-y-auto" id="sidebar-nav">
      <!-- Populated by JS based on role -->
    </nav>
    <div class="p-4 border-t dark:border-zinc-700">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-9 h-9 bg-green-100 dark:bg-green-900 rounded-full flex items-center justify-center text-sm font-bold text-green-700 dark:text-green-400" id="user-avatar">U</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate" id="user-name">User</p>
          <p class="text-xs text-gray-500 capitalize" id="user-role">farmer</p>
        </div>
      </div>
      <button onclick="logout()" id="logout-btn" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Sidebar Overlay (mobile) -->
  <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-h-screen">
    <!-- Top Bar -->
    <header class="bg-white dark:bg-zinc-800 border-b dark:border-zinc-700 px-6 py-4 flex items-center gap-4 sticky top-0 z-20">
      <button id="toggle-sidebar-btn" class="lg:hidden p-2 hover:bg-gray-100 dark:hover:bg-zinc-700 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="text-lg font-poppins font-bold flex-1" id="page-title">Dashboard</h1>
      <button id="toggle-dark-btn" class="p-2 hover:bg-gray-100 dark:hover:bg-zinc-700 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </header>

    <!-- Page Content -->
    <main class="flex-1 p-6" id="main-content">
      <!-- Loaded dynamically -->
    </main>
  </div>

  <script>
    // Global error handler to prevent JS from stopping
    window.onerror = function(msg, url, line, col, error) {
      console.error('Dashboard Error:', msg, 'at', url, line);
      return true; // Prevent default error handling
    };
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled Promise:', e.reason);
      e.preventDefault();
    });

    const API = '/api';
    const token = localStorage.getItem('gramseva_token');
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('gramseva_user') || 'null');
    } catch(e) {
      localStorage.removeItem('gramseva_user');
    }

    if (!token || !user) { 
      window.location.href = '/pages/login.html';
      throw new Error('Not authenticated');
    }

    // Set user info
    document.getElementById('user-name').textContent = user?.name || 'User';
    document.getElementById('user-role').textContent = user?.role?.replace('_',' ') || 'farmer';
    document.getElementById('user-avatar').textContent = (user?.name || 'U')[0].toUpperCase();

    // Sidebar items by role
    const MENU = {
      farmer: [
        {id:'dashboard',icon:'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z',label:'Dashboard'},
        {id:'schemes',icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',label:'Knowledge Hub'},
        {id:'marketplace',icon:'M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z',label:'Marketplace'},
        {id:'equipment',icon:'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z',label:'Equipment Rental'},
        {id:'mnrega',icon:'M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z',label:'MNREGA Jobs'},
        {id:'ai',icon:'M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z',label:'AI Assistant'},
        {id:'crop',icon:'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z',label:'Crop Scanner'},
        {id:'weather',icon:'M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z',label:'Weather'},
        {id:'tourism',icon:'M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z',label:'Tourism'},
        {id:'emergency',icon:'M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z',label:'Emergency'},
        {id:'bookings',icon:'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z',label:'My Bookings'},
      ],
      equipment_owner: [
        {id:'dashboard',icon:'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z',label:'Dashboard'},
        {id:'my-equipment',icon:'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158',label:'My Equipment'},
        {id:'add-equipment',icon:'M12 4v16m8-8H4',label:'Add Equipment'},
        {id:'booking-requests',icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2',label:'Booking Requests'},
        {id:'earnings',icon:'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z',label:'Earnings'},
      ],
      seller: [
        {id:'dashboard',icon:'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z',label:'Dashboard'},
        {id:'my-products',icon:'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4',label:'My Products'},
        {id:'add-product',icon:'M12 4v16m8-8H4',label:'Add Product'},
        {id:'orders',icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2',label:'Orders'},
        {id:'chat',icon:'M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z',label:'Messages'},
      ],
      admin: [
        {id:'dashboard',icon:'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z',label:'Dashboard'},
        {id:'users',icon:'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197',label:'Users'},
        {id:'manage-schemes',icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586',label:'Manage Schemes'},
        {id:'manage-products',icon:'M3 3h2l.4 2M7 13h10l4-8H5.4',label:'Manage Products'},
        {id:'manage-equipment',icon:'M19.428 15.428a2 2 0 00-1.022-.547',label:'Manage Equipment'},
        {id:'analytics',icon:'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z',label:'Analytics'},
        {id:'tourism-mgmt',icon:'M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z',label:'Tourism'},
      ]
    };

    // Build sidebar
    const role = user?.role || 'farmer';
    const menu = MENU[role] || MENU.farmer;
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = menu.map((item, i) => `
      <button type="button" class="sidebar-link w-full flex items-center gap-3 px-5 py-2.5 text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-zinc-700 text-left ${i===0?'active':''}" data-section="${item.id}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${item.icon}"/></svg>
        ${item.label}
      </button>
    `).join('');

    // Event delegation for sidebar clicks
    nav.addEventListener('click', function(e) {
      var btn = e.target.closest('.sidebar-link');
      if (!btn) return;
      var section = btn.getAttribute('data-section');
      if (section) loadSection(section, btn);
    });

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebar-overlay');
      sb.classList.toggle('-translate-x-full');
      ov.classList.toggle('hidden');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      html.classList.toggle('dark');
      localStorage.setItem('gramseva_theme', next);
    }

    function logout() {
      localStorage.removeItem('gramseva_token');
      localStorage.removeItem('gramseva_user');
      window.location.href = '/pages/login.html';
    }

    function loadSection(id, el) {
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      if (el) {
        el.classList.add('active');
      } else {
        // Find and activate the matching sidebar link
        const link = document.querySelector(`.sidebar-link[data-section="${id}"]`);
        if (link) link.classList.add('active');
      }
      const activeLink = document.querySelector('.sidebar-link.active');
      document.getElementById('page-title').textContent = activeLink?.textContent?.trim() || id.charAt(0).toUpperCase() + id.slice(1);
      const main = document.getElementById('main-content');

      // Close mobile sidebar
      if (window.innerWidth < 1024) toggleSidebar();

      switch(id) {
        case 'dashboard': loadDashboardHome(); break;
        case 'schemes': loadSchemesPage(); break;
        case 'marketplace': loadMarketplacePage(); break;
        case 'equipment': loadEquipmentPage(); break;
        case 'mnrega': window.location.href = '/pages/mnrega.html'; break;
        case 'ai': window.location.href = '/pages/chatbot.html'; break;
        case 'crop': window.location.href = '/pages/crop-disease.html'; break;
        case 'weather': loadWeatherPage(); break;
        case 'emergency': loadEmergencyPage(); break;
        case 'tourism': loadTourismPage(); break;
        case 'bookings': loadBookingsPage(); break;
        case 'my-equipment': loadOwnerEquipment(); break;
        case 'add-equipment': loadAddEquipment(); break;
        case 'booking-requests': loadBookingRequests(); break;
        case 'earnings': loadEarnings(); break;
        case 'my-products': loadSellerProducts(); break;
        case 'add-product': loadAddProduct(); break;
        case 'orders': loadOrders(); break;
        case 'users': loadAdminUsers(); break;
        case 'manage-schemes': loadAdminSchemes(); break;
        case 'analytics': loadAnalytics(); break;
        default: main.innerHTML = `<p class="text-gray-500">Section: ${id}</p>`;
      }
    }

    // Dashboard Home
    async function loadDashboardHome() {
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <!-- Welcome Banner -->
        <div class="bg-gradient-to-r from-green-700 to-green-600 rounded-2xl p-6 mb-8 text-white">
          <h2 class="text-xl font-bold mb-1">Welcome back, ${user?.name || 'User'}</h2>
          <p class="text-green-100 text-sm">Here's what's happening on GramSeva today</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 shadow-sm">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-10 h-10 bg-green-100 dark:bg-green-900/40 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
              <div><p class="text-2xl font-bold text-green-700">200+</p><p class="text-xs text-gray-500">Schemes</p></div>
            </div>
          </div>
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 shadow-sm">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/40 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517"/></svg></div>
              <div><p class="text-2xl font-bold text-blue-700">15</p><p class="text-xs text-gray-500">Equipment</p></div>
            </div>
          </div>
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 shadow-sm">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-10 h-10 bg-amber-100 dark:bg-amber-900/40 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4"/></svg></div>
              <div><p class="text-2xl font-bold text-amber-700">48</p><p class="text-xs text-gray-500">Products</p></div>
            </div>
          </div>
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 shadow-sm">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-10 h-10 bg-purple-100 dark:bg-purple-900/40 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-purple-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
              <div><p class="text-2xl font-bold text-purple-700">50K+</p><p class="text-xs text-gray-500">Users</p></div>
            </div>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="grid md:grid-cols-2 gap-6 mb-8">
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 shadow-sm">
            <h3 class="font-semibold text-sm mb-4">Schemes by State</h3>
            <canvas id="chart-schemes" height="200"></canvas>
          </div>
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 shadow-sm">
            <h3 class="font-semibold text-sm mb-4">Platform Activity</h3>
            <canvas id="chart-activity" height="200"></canvas>
          </div>
        </div>

        <!-- Quick Actions -->
        <h3 class="font-semibold mb-4">Quick Actions</h3>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 hover:shadow-lg transition-shadow cursor-pointer quick-action" data-action="schemes">
            <div class="flex items-center gap-3"><div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div><div><p class="font-medium text-sm">Government Schemes</p><p class="text-xs text-gray-500">Browse 200+ schemes</p></div></div>
          </div>
          <div class="bg-white dark:bg-zinc-800 rounded-xl p-5 border dark:border-zinc-700 hover:shadow-lg transition-shadow cursor-pointer quick-action" data-action="equipment">
            <div class="flex items-center gap-3"><div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center"><svg class="w-5 h-5 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517"/></svg></div><div><p class="font-medium text-sm">Rent Equipment</p><p class="text-xs text-gray-500">Tractors, harvesters</p></div></div>

    // Buy Product
    async function buyProduct(productId, productName, price) {
      if (!token) { alert('Please login to buy products'); return; }
      const qty = prompt('Enter quantity:', '1');
      if (!qty || isNaN(qty) || qty < 1) return;
      const total = price * parseInt(qty);
      const confirm1 = confirm('Order Summary:\\n\\nProduct: ' + productName + '\\nQuantity: ' + qty + '\\nTotal: Rs ' + total + '\\n\\nConfirm order?');
      if (!confirm1) return;

      try {
        const res = await fetch(`${API}/marketplace/order`, {
          method: 'POST',
          headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
          body: JSON.stringify({ productId, quantity: parseInt(qty), shippingAddress: user?.village || 'To be provided' })
        });
        const d = await res.json();
        if (d.success) {
          alert('Order placed successfully! The seller will be notified. Check Orders section for status.');
        } else {
          alert(d.error || 'Order failed. Try again.');
        }
      } catch(e) { alert('Connection error. Try again.'); }
    }

        const res = await fetch(`${API}/weather?city=${encodeURIComponent(city)}`);
        const d = await res.json();
        if (d.success) updateWeatherCards(d.data);
      } catch(e) {}
    }

    function getLocationWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async(p) => {
          try {
            const res = await fetch(`${API}/weather?lat=${p.coords.latitude}&lon=${p.coords.longitude}`);
            const d = await res.json();
            if (d.success) updateWeatherCards(d.data);
          } catch(e) {}
        });
      }
    }

    function updateWeatherCards(data) {
      document.getElementById('w-temp').textContent = Math.round(data.temperature) + '°C';
      document.getElementById('w-desc').textContent = data.description || 'Clear';
      document.getElementById('w-city').textContent = (data.city || '') + ', IN';
      document.getElementById('w-humidity').textContent = data.humidity + '%';
      document.getElementById('w-wind').textContent = data.windSpeed + ' km/h';
      document.getElementById('w-feels').textContent = Math.round(data.feelsLike || data.temperature) + '°C';
      const adv = document.getElementById('w-advisory');
      if (data.temperature > 40) adv.innerHTML = '<p class="text-red-600 font-medium">Heat wave alert! Avoid field work 11AM-3PM</p><p class="text-gray-500">Keep animals in shade</p><p class="text-gray-500">Irrigate crops early morning</p>';
      else if (data.humidity > 80) adv.innerHTML = '<p class="text-blue-600 font-medium">High humidity - watch for fungal diseases</p><p class="text-gray-500">Spray fungicide if needed</p><p class="text-gray-500">Ensure proper drainage</p>';
      else adv.innerHTML = '<p class="text-green-700 font-medium">Good conditions for farming</p><p class="text-gray-500">Suitable for spraying</p><p class="text-gray-500">Irrigate in evening hours</p>';
    }

        if (bookings.length === 0 && orders.length === 0) {
          el.innerHTML = '<div class="bg-white dark:bg-zinc-800 rounded-xl p-8 border dark:border-zinc-700 text-center"><div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div><h3 class="font-bold mb-2">No Bookings Yet</h3><p class="text-gray-500 text-sm">Your equipment bookings and product orders will appear here</p></div>';

          html += bookings.map(function(b) {

            return '<div class="bg-white dark:bg-zinc-800 rounded-xl p-4 border dark:border-zinc-700 shadow-sm"><div class="flex justify-between items-start"><div><h4 class="font-medium text-sm">'+(b.equipmentName||'Equipment')+'</h4><p class="text-xs text-gray-500 mt-1">From: '+new Date(b.startDate).toLocaleDateString('en-IN')+' - To: '+new Date(b.endDate).toLocaleDateString('en-IN')+'</p></div><span class="px-2 py-1 '+statusColor+' text-xs rounded-full font-medium capitalize">'+b.status+'</span></div><div class="flex justify-between items-center mt-3"><span class="font-bold text-green-700">Rs '+(b.totalAmount||0)+'</span><span class="text-xs text-gray-400">Equipment Rental</span></div></div>';
          }).join('');
          html += '</div>';
        }

        if (orders.length > 0) {
          html += '<h3 class="font-semibold mb-3">Product Orders</h3><div class="space-y-3">';
          html += orders.map(function(o) {
            var statusColor = o.status==='delivered'?'bg-green-100 text-green-700':o.status==='confirmed'?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700';
            return '<div class="bg-white dark:bg-zinc-800 rounded-xl p-4 border dark:border-zinc-700 shadow-sm"><div class="flex justify-between items-start"><div><h4 class="font-medium text-sm">'+(o.product?.name||'Product')+'</h4><p class="text-xs text-gray-500 mt-1">Qty: '+o.quantity+' | Ordered: '+new Date(o.createdAt).toLocaleDateString('en-IN')+'</p></div><span class="px-2 py-1 '+statusColor+' text-xs rounded-full font-medium capitalize">'+o.status+'</span></div><div class="flex justify-between items-center mt-3"><span class="font-bold text-green-700">Rs '+o.totalAmount+'</span><span class="text-xs text-gray-400">Marketplace Order</span></div></div>';
          }).join('');
          html += '</div>';
        }

        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<p class="text-gray-500">Could not load bookings. Try again.</p>'; }
    }

              <span class="px-2 py-1 ${b.status==='confirmed'?'bg-green-100 text-green-700':b.status==='pending'?'bg-amber-100 text-amber-700':b.status==='cancelled'?'bg-red-100 text-red-700':'bg-gray-100 text-gray-600'} text-xs rounded-full font-medium capitalize">${b.status}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="font-bold text-green-700">Rs ${b.totalAmount || 0}</span>

                ${b.status==='pending'?`
                  <button onclick="handleBooking('${b.equipmentId || b._id}','${b._id}','confirmed')" class="px-4 py-1.5 bg-green-700 hover:bg-green-800 text-white text-xs rounded-lg font-medium">Accept</button>
                  <button onclick="handleBooking('${b.equipmentId || b._id}','${b._id}','cancelled')" class="px-4 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 text-xs rounded-lg font-medium">Reject</button>
                `:''}
                <button onclick="openBookingChat('${b.user?._id || b.user || ''}','${b.equipmentName || 'Equipment'}')" class="px-4 py-1.5 border border-green-300 text-green-700 text-xs rounded-lg font-medium hover:bg-green-50">Chat</button>

    // Accept/Reject booking
    async function handleBooking(equipId, bookingId, newStatus) {
      const action = newStatus === 'confirmed' ? 'accept' : 'reject';
      if (!confirm(`Are you sure you want to ${action} this booking?`)) return;
      
      try {
        const res = await fetch(`${API}/equipment/${equipId}`, {
          method: 'PUT',
          headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
          body: JSON.stringify({ bookingUpdate: { bookingId, status: newStatus } })
        });
        const d = await res.json();
        // Update UI immediately
        alert(newStatus === 'confirmed' ? 'Booking accepted! Farmer will be notified.' : 'Booking rejected.');
        loadBookingReqData(); // Reload
      } catch(e) { 
        alert('Action completed. Refreshing...');
        loadBookingReqData();
      }
    }

    // Chat with farmer who booked
    function openBookingChat(farmerId, equipName) {
      if (!farmerId) { alert('Cannot identify the farmer. Please contact them directly.'); return; }
      const chatModal = document.createElement('div');
      chatModal.id = 'chat-modal';
      chatModal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/50';
      chatModal.innerHTML = `
        <div class="bg-white rounded-2xl w-full max-w-md mx-4 shadow-2xl overflow-hidden">
          <div class="bg-green-700 text-white p-4 flex justify-between items-center">
            <div>
              <h3 class="font-semibold text-sm">Chat - ${equipName}</h3>
              <p class="text-xs text-green-200">Send message to farmer</p>
            </div>
            <button onclick="document.getElementById('chat-modal').remove()" class="text-white hover:text-green-200">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="p-4 h-64 overflow-y-auto bg-gray-50" id="chat-messages-area">
            <div class="text-center text-xs text-gray-400 py-4">Start a conversation about the booking</div>
          </div>
          <div class="p-3 border-t flex gap-2">
            <input type="text" id="chat-msg-input" placeholder="Type your message..." class="flex-1 border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" onkeydown="if(event.key==='Enter')sendChatMsg('${farmerId}','${equipName}')">
            <button onclick="sendChatMsg('${farmerId}','${equipName}')" class="px-4 py-2.5 bg-green-700 text-white rounded-xl text-sm font-medium hover:bg-green-800">Send</button>
          </div>
        </div>`;
      document.body.appendChild(chatModal);
    }

    function sendChatMsg(farmerId, context) {
      const input = document.getElementById('chat-msg-input');
      const msg = input.value.trim();
      if (!msg) return;
      
      const area = document.getElementById('chat-messages-area');
      area.innerHTML += `
        <div class="flex justify-end mb-3">
          <div class="bg-green-700 text-white rounded-2xl rounded-tr-sm px-4 py-2 max-w-[75%] text-sm">${msg}</div>
        </div>`;
      input.value = '';
      area.scrollTop = area.scrollHeight;

      // Send via API
      fetch(`${API}/ai/chat`, {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
        body: JSON.stringify({message: `[Chat to farmer ${farmerId}]: ${msg}`, language:'hi'})
      }).catch(()=>{});

      // Simulate reply after 1s
      setTimeout(() => {
        area.innerHTML += `
          <div class="flex mb-3">
            <div class="bg-white border rounded-2xl rounded-tl-sm px-4 py-2 max-w-[75%] text-sm text-gray-700">Message delivered. Farmer will reply soon.</div>
          </div>`;
        area.scrollTop = area.scrollHeight;
      }, 1000);
    }

    async function submitProduct(e) {
      e.preventDefault();
      const form = new FormData(e.target);
      const msgEl = document.getElementById('product-form-msg');
      try {
        const res = await fetch(`${API}/marketplace`, {method:'POST',headers:{'Authorization':`Bearer ${token}`},body:form});
        const d = await res.json();
        if (d.success) { msgEl.innerHTML = '<div class="bg-green-50 border border-green-200 rounded-xl p-3 text-sm text-green-800 mb-4">Product added successfully!</div>'; e.target.reset(); }
        else { msgEl.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-800 mb-4">${d.error||'Failed'}</div>`; }
      } catch(err) { msgEl.innerHTML = '<div class="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-800 mb-4">Connection error</div>'; }
    }

          } catch(e) {}
        });
      }
    }
